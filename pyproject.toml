[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slop"
version = "0.2.0"
description = "slop: WikiOasis deployment tooling, scap style"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["ruff==0.14.0"]

[project.scripts]
slop = "Slop.Cli:Cli.main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["Slop*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "PL", "RUF"]
ignore = ["N802", "N803", "N806", "N815", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW2901", "RUF012", "SIM108", "E501", "B023", "PLC0415", "UP047", "B027"]

[tool.ruff.lint.isort]
known-first-party = ["Slop"]

[tool.ruff.format]
quote-style = "double"
